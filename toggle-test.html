<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/adamson-ccit/public/assets/css/admin-faculty.css">
</head>
<body>
    <div class="admin-main">
        <div class="bootstrap-content">
            <h1><i class="fas fa-certificate"></i> Faculty Certifications Test</h1>
            
            <!-- Test Certifications List -->
            <div class="card">
                <div class="card-header collapse-btn" data-bs-toggle="collapse" data-bs-target="#certificationsListCollapse">
                    <h5 class="mb-0">
                        <i class="fas fa-list"></i> Faculty Certification Awards (5)
                        <i class="fas fa-chevron-down float-end"></i>
                    </h5>
                </div>
                <div id="certificationsListCollapse" class="collapse show">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Faculty</th>
                                        <th>Certification</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Dr. John Doe</td>
                                        <td>AWS Certified Solutions Architect</td>
                                        <td><span class="badge bg-success">Active</span></td>
                                        <td>
                                            <button class="btn btn-sm btn-warning">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Handle collapsible cards
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing collapse functionality');
            
            const collapseButtons = document.querySelectorAll('[data-bs-toggle="collapse"]');
            console.log('Found collapse buttons:', collapseButtons.length);
            
            collapseButtons.forEach(function(button) {
                button.addEventListener('click', function() {
                    const target = document.querySelector(button.getAttribute('data-bs-target'));
                    const icon = button.querySelector('.float-end i, .float-right i');
                    
                    console.log('Button clicked, target:', target, 'icon:', icon);
                    
                    if (target) {
                        target.addEventListener('shown.bs.collapse', function() {
                            if (icon) {
                                icon.className = 'fas fa-chevron-up';
                                console.log('Collapse shown, icon changed to up');
                            }
                        });
                        
                        target.addEventListener('hidden.bs.collapse', function() {
                            if (icon) {
                                icon.className = 'fas fa-chevron-down';
                                console.log('Collapse hidden, icon changed to down');
                            }
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
