<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Admin CSS Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/adamson-ccit/public/assets/css/admin-faculty.css">
</head>
<body>
    <div class="admin-main">
        <div class="bootstrap-content">
            <h1><i class="fas fa-users"></i> Faculty Profile Management</h1>
            
            <!-- Test Card -->
            <div class="card">
                <div class="card-header collapse-btn" data-bs-toggle="collapse" data-bs-target="#testCollapse">
                    <h5 class="mb-0">
                        <i class="fas fa-cog"></i> Test Card Header with Long Title
                        <i class="fas fa-chevron-down float-end"></i>
                    </h5>
                </div>
                <div id="testCollapse" class="collapse show">
                    <div class="card-body">
                        <!-- Test Table -->
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Name</th>
                                        <th>Department</th>
                                        <th>Role</th>
                                        <th>Title</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>
                                            <strong>Dr. John Doe with a Very Long Name</strong>
                                            <br><small class="text-muted">Additional info here</small>
                                        </td>
                                        <td><span class="badge bg-secondary">IT&IS</span></td>
                                        <td>Professor</td>
                                        <td>PhD in Computer Science with Specialization</td>
                                        <td>
                                            <button class="btn btn-sm btn-warning">
                                                <i class="fas fa-edit"></i>
                                            </button>
                                            <form class="inline-form">
                                                <button type="submit" class="btn btn-sm btn-danger">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
